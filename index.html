<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/FLUSS_LOGO.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluss</title>
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("fluss-theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          // Must match --color-app in index.css for both themes.
          document.documentElement.style.backgroundColor = dark
            ? "oklch(0.172 0.006 152)"
            : "oklch(0.949 0.004 152)";
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
