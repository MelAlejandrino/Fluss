[package]
name = "fluss"
version = "0.11.2"
description = "A minimal desktop media downloader powered by yt-dlp and FFmpeg."
authors = ["MelAlejandrino"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fluss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
log = "0.4"
# Desktop-only plugins (the updater has no mobile implementation); Fluss targets
# Windows/macOS/Linux. `process` is only here for the post-install relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

