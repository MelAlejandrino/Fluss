name: CI

# Correctness gate on every branch push and PR. Tag pushes are handled by
# release.yml, not here.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: ubuntu-latest
            engines: linux
          - platform: macos-latest
            engines: macos
          - platform: windows-latest
            engines: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev

      # 22, not 20: jsdom (via undici) calls worker_threads.markAsUncloneable,
      # which only exists from Node 22.5 — on 20 every vitest worker fails to
      # start. Node 20 is also out of maintenance.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # tsc (strict) + vite build. Also produces dist/, which the Rust crate's
      # generate_context! embeds — so this must run before cargo test.
      - name: Type-check and build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Verify bundled engines run (all platforms)
        shell: bash
        run: bash scripts/fetch-binaries.sh ${{ matrix.engines }}

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
