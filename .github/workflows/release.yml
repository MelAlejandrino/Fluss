name: Release

# Push a version tag (e.g. v0.1.0) to build installers and open a DRAFT release.
# The draft is created ONLY if all three platforms build successfully — a single
# platform failure aborts the release (no partial draft). You publish the draft.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: true # one platform fails -> cancel the rest, no release
      matrix:
        include:
          - platform: windows-latest
            engines: windows
          - platform: macos-latest
            engines: macos
          - platform: ubuntu-latest
            engines: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync app version to tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e "const f='package.json',j=require('./'+f);j.version='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const f='src-tauri/tauri.conf.json',j=require('./'+f);j.version='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"

      - name: Fetch bundled engines
        shell: bash
        run: bash scripts/fetch-binaries.sh ${{ matrix.engines }}

      # Build only — no release here, so a failure can't leave a partial draft.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.engines }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  release:
    needs: build # runs only if ALL build jobs succeeded
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            /^## / { if (found) exit; if (index($0, ver)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See the commit history for changes in ${GITHUB_REF_NAME}." > notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Fluss ${{ github.ref_name }}"
          body_path: notes.md
          draft: true
          files: artifacts/**/*
