name: Release

# Push a version tag (e.g. v0.1.0) to build installers and open a DRAFT release.
# The draft is created ONLY if all three platforms build successfully — a single
# platform failure aborts the release (no partial draft). You publish the draft.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: true # one platform fails -> cancel the rest, no release
      matrix:
        include:
          - platform: windows-latest
            engines: windows
          - platform: macos-latest
            engines: macos
          - platform: ubuntu-latest
            engines: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev xvfb

      # Kept in step with ci.yml (see the note there on Node 22).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync app version to tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e "const f='package.json',j=require('./'+f);j.version='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const f='src-tauri/tauri.conf.json',j=require('./'+f);j.version='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          # The crate version too: without it Cargo.toml drifts behind the tag
          # forever, and anything reading the crate version reports a release
          # that shipped long ago.
          node -e "const fs=require('fs'),f='src-tauri/Cargo.toml';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/^version = \".*\"$/m,'version = \"$VER\"'))"

      # ci.yml only gates branch pushes and PRs, so without this a tag builds
      # and ships whatever it points at — including a commit that never saw CI.
      - name: Frontend tests
        run: npm test

      - name: Fetch bundled engines
        shell: bash
        run: bash scripts/fetch-binaries.sh ${{ matrix.engines }}

      # Apple Silicon refuses to exec unsigned binaries, so ad-hoc sign the
      # bundled engines. (Full Gatekeeper-free distribution still needs a
      # Developer ID + notarization.)
      - name: Ad-hoc sign bundled engines (macOS)
        if: matrix.engines == 'macos'
        run: |
          for bin in yt-dlp ffmpeg deno; do
            codesign --force --sign - "src-tauri/binaries/macos/$bin"
          done

      # Prove the bundled engines actually execute on this OS/arch (the mac
      # runner is arm64, so this verifies Apple Silicon). Fails the build if a
      # binary is the wrong arch or won't run.
      - name: Verify bundled engines run
        shell: bash
        run: |
          D="src-tauri/binaries/${{ matrix.engines }}"
          EXT=""; [ "${{ matrix.engines }}" = "windows" ] && EXT=".exe"
          "$D/yt-dlp$EXT" --version
          "$D/ffmpeg$EXT" -version | head -1
          "$D/deno$EXT" --version

      # Build only — no release here, so a failure can't leave a partial draft.
      # The signing key produces the `.sig` files the in-app updater verifies;
      # without these secrets the build fails rather than shipping unsigned
      # artifacts nobody can update from.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # After the build, not before: `generate_context!` embeds dist/, which
      # tauri-action is what produces here. Still ahead of the upload, so a
      # failure can't put artifacts on a draft release.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Prove the app actually launches on Linux (catches missing webkit libs,
      # crash-on-start). Runs the built binary headlessly and checks it stays up.
      - name: Smoke-test app launch (Linux)
        if: matrix.engines == 'linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          xvfb-run -a ./src-tauri/target/release/fluss &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            echo "App launched and stayed up."
            kill "$PID" 2>/dev/null || true
          else
            echo "App exited on launch"; exit 1
          fi

      # Confirm the ad-hoc signature is valid so Apple Silicon will launch it.
      - name: Verify app signature (macOS)
        if: matrix.engines == 'macos'
        run: |
          APP=$(find src-tauri/target/release/bundle -maxdepth 3 -name "*.app" | head -1)
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # Only the distributable installers — NOT the whole bundle tree, which
      # also contains the AppImage/deb internal payload (libs, the raw binaries)
      # that must not become release assets. The `.sig` files and the macOS
      # `.app.tar.gz` are the updater's payload; `latest.json` (built in the
      # release job) points at them.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.engines }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  release:
    needs: build # runs only if ALL build jobs succeeded
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            /^## / { if (found) exit; if (index($0, ver)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See the commit history for changes in ${GITHUB_REF_NAME}." > notes.md

      # What the in-app updater reads: version + per-platform installer URL and
      # its signature. Any missing signature fails the release rather than
      # publishing something nobody can update from.
      - name: Build updater manifest (latest.json)
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          # $1 platform key (for the error message), $2 installer glob.
          entry() {
            local file sig
            file=$(find artifacts -type f -name "$2" ! -name "*.sig" | head -1)
            [ -n "$file" ] || { echo "::error::no updater artifact for $1 ($2)"; exit 1; }
            sig="$file.sig"
            [ -f "$sig" ] || { echo "::error::no signature next to $file"; exit 1; }
            jq -n --arg url "$BASE/$(basename "$file")" \
                  --arg signature "$(cat "$sig")" \
                  '{url: $url, signature: $signature}'
          }

          # The macOS runner is arm64, so only Apple Silicon is published.
          jq -n \
            --arg version "$VER" \
            --arg notes "$(cat notes.md)" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson windows "$(entry windows-x86_64 '*-setup.exe')" \
            --argjson darwin "$(entry darwin-aarch64 '*.app.tar.gz')" \
            --argjson linux "$(entry linux-x86_64 '*.AppImage')" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {
                "windows-x86_64": $windows,
                "darwin-aarch64": $darwin,
                "linux-x86_64": $linux
              }}' > latest.json
          cat latest.json

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Fluss ${{ github.ref_name }}"
          body_path: notes.md
          draft: true
          files: |
            artifacts/**/*
            latest.json
