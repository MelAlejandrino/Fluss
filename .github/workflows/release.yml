name: Release

# Push a version tag (e.g. v0.1.0) to build installers and open a DRAFT release.
# You review the draft and publish it yourself.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write # create the release + upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            engines: windows
          - platform: macos-latest
            engines: macos
          - platform: ubuntu-latest
            engines: linux
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync app version to tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e "const f='package.json',j=require('./'+f);j.version='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const f='src-tauri/tauri.conf.json',j=require('./'+f);j.version='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"

      - name: Fetch bundled engines
        shell: bash
        run: bash scripts/fetch-binaries.sh ${{ matrix.engines }}

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v ver="$VER" '
            /^## / { if (found) exit; if (index($0, ver)) { found=1; next } }
            found { print }
          ' CHANGELOG.md)"
          [ -z "$NOTES" ] && NOTES="See the commit history for changes in ${GITHUB_REF_NAME}."
          {
            echo "body<<___EOF___"
            echo "$NOTES"
            echo "___EOF___"
          } >> "$GITHUB_OUTPUT"

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Fluss ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
